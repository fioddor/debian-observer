# SPDX-License-Identifier: AGPL-3.0-or-later
# Purpose: Local app deployment orchestration for containerized usage.
# Usage..: docker compose -f deploy/compose/docker-compose.yml up -d
# Design.: Provides CLI, NATS JetStream as the durable event backbone and API.
#          API host port 8088 (2026-10-26): 8000 collided with nginx-proxy
#          on this host; 8088 is used host-side AND container-side so docs,
#          healthchecks and the CLI default stay consistent (see
#          tests/test_deployment.py and docs/user-guide.md).
# Author.: Igor Zubiaurre <igor@zubiaurre.es>
# Pending: To be extended as features are added.
#-----------------------------------------------------------------------------

services:
  debian-observer:
    build:
      # context is the REPO ROOT: the Dockerfile copies pyproject/src
      # from it. context "." broke COPY src/ (regression test pins it).
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    container_name: debian-observer
    hostname: deb-obs
    stdin_open: true          # keeps STDIN open (like -i)
    tty: true                 # allocates a TTY (like -t)
    working_dir: /app
    volumes:
      - ../..:/app            # bind mount: host repo root ↔ container /app
    environment:
      - PYTHONUNBUFFERED=1
    # The Dockerfile HEALTHCHECK (wget :8088) targets the API service;
    # this is the interactive CLI service -> disable it or  (CI gate) aborts: sleep infinity never listens.
    healthcheck:
      disable: true
    command: bash -c "pipx install /app/dist/debian_observer.whl;while sleep 1000; do :; done"

  nats:
    image: nats:2.10-alpine
    command: "-js -m 8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data/jetstream
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - debian-observer

  api:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    ports:
      - "8088:8088"
    environment:
      - NATS_URL=nats://nats:4222
      - OTEL_EXPORTER=console
      # Optional: override default public UDD mirror with a private one
      # - UDD_HOST=192.168.1.218
      # - UDD_PORT=5432
      # - UDD_DATABASE=udd
      # - UDD_USER=udd
      # - UDD_PASSWORD=udd
      # Optional: pre-load Parquet data for the API (loaded via serve CLI)
      # - PARQUET_DIR=/app/data/parquet
    volumes:
      - api-data:/app/data
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - debian-observer
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      # 60s start period: the api cold-boots slowly on old spinning disks
      # (pyarrow import with cold page cache can take ~90s); failures
      # during start_period do not count against retries.
      start_period: 180s
      retries: 5
    restart: unless-stopped

volumes:
  nats-data:
  api-data:

networks:
  debian-observer:
    driver: bridge
