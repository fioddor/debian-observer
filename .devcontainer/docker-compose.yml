# SPDX-License-Identifier: AGPL-3.0-or-later
# Purpose: Local containerized deployment orchestration for developers.
# Design.: No service implemented yet => Endless loop to keep the container
#          up after the deployment of development dependencies.
# Author.: Igor Zubiaurre <igor@zubiaurre.es>
# Pending: To be extended as features are added.
#-----------------------------------------------------------------------------

services:
  debian-observer-development:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: debian-observer-dev
    hostname: deb-obs-dev
    stdin_open: true          # keeps STDIN open (like -i)
    tty: true                 # allocates a TTY (like -t)
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached              # bind mount: host ./workspace ↔ container /workspace
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "
        cd /workspace &&
        pip install --user -e '.[dev]' &&
        echo 'Dependencies installed. Run tests with: pytest tests/' &&
        sleep infinity
      "
networks:
  debian-observer:
    driver: bridge
